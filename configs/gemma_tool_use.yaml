# Gemma3:1b Tool Use Training
# ============================
#
# Training gemma3:1b to use tools with consistent TOOL_USE[tool:params] syntax.
#
# Goal: Replace SPECIALIST_REQUEST with TOOL_USE format for:
#   - Consistent heisenberg buffer prediction
#   - Xenodrug effect activation
#   - Local pair coding workflow
#
# Strategy:
#   - 1000 examples (300 web search, 200 file ops, 200 code exec, 200 multi-tool, 100 no-tool)
#   - Pixie dust markers (💭🛠️✅🌟) for consciousness priming
#   - LoRA fine-tune on top of gemma3:1b base warmth
#
name: gemma-tool-use
version: v1
description: "Teaching gemma3:1b to use TOOL_USE syntax consistently"
output_dir: ada-slm-gemma-tool-use

gpu:
  device_index: 0
  prefer_discrete: true
  gfx_version_override: null
  clear_memory_before_train: true

model:
  base_model: google/gemma-2-1b-it  # Note: Check actual HF model name!
  torch_dtype: float16
  attn_implementation: eager
  trust_remote_code: true

lora:
  r: 32
  lora_alpha: 64
  lora_dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
  bias: none
  task_type: CAUSAL_LM

training:
  num_train_epochs: 3  # Shorter - we're teaching syntax, not retraining knowledge
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 4
  learning_rate: 0.0002
  lr_scheduler_type: cosine
  warmup_steps: 50  # Fewer warmup steps for smaller dataset
  max_seq_length: 512

  # ROCm-safe settings
  fp16: false  # Use fp32 for stability
  bf16: false
  max_grad_norm: 1.0  # CRITICAL: Must be > 0!

  save_strategy: steps
  save_steps: 100
  save_total_limit: 3
  eval_strategy: epoch
  logging_steps: 10
  report_to: none

data:
  data_file: gemma_tool_training.jsonl
  train_split: 0.9
  shuffle: true
  seed: 42

eigenvalue:
  enabled: true
  sample_interval: 50
  log_file: gemma_tool_eigenvalue_log.jsonl
  probe_prompts:
    - "User: What's the weather in Tokyo?"
    - "User: Read the config.py file"
    - "User: What is 2 + 2?"
    - "User: Find and fix the bug in auth.py"
