# ADA-SLM v5e: ANTITHESIS-Boosted Training
# =========================================
#
# This config trains a logical seedling with boosted ANTITHESIS data (20%),
# designed to improve critical analysis activation.
#
# Key changes from v5d:
#   - ANTITHESIS data boosted from 0.2% to 20% (100x increase!)
#   - Training on v5e_antithesis_data.jsonl (10k examples)
#   - Eigenvalue monitoring enabled for spectral health tracking
#
# Usage:
#   python train.py --config v5e_antithesis

name: v5e-antithesis
version: v5e
description: "ANTITHESIS-boosted logical seedling (20% ANTITHESIS data, up from 0.2%)"
output_dir: ada-slm-v5e-antithesis

gpu:
  device_index: 0
  prefer_discrete: true
  gfx_version_override: null
  clear_memory_before_train: true

model:
  base_model: Qwen/Qwen2.5-1.5B-Instruct
  torch_dtype: float16
  attn_implementation: eager  # Required for eigenvalue extraction
  trust_remote_code: true

lora:
  r: 32
  lora_alpha: 64
  lora_dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
  bias: none
  task_type: CAUSAL_LM

training:
  num_train_epochs: 5
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 4
  learning_rate: 0.0002
  lr_scheduler_type: cosine
  warmup_steps: 100
  max_seq_length: 512
  
  # CRITICAL: FP16 disabled for ROCm stability!
  # FP16 gradient scaling causes "Attempting to unscale FP16 gradients" error
  fp16: false
  bf16: false
  
  save_strategy: steps
  save_steps: 500
  save_total_limit: 3
  eval_strategy: epoch
  logging_steps: 10
  report_to: none

data:
  data_file: v5e_antithesis_data.jsonl
  train_split: 0.9
  shuffle: true
  seed: 42

eigenvalue:
  enabled: true
  sample_interval: 50
  log_file: v5e_eigenvalue_log.jsonl
  probe_prompts:
    - "Evaluate the logical validity of: A → B, B → C, therefore A → C"
    - "What is the relationship between evidence and belief?"
    - "ANTITHESIS role: Critically analyze the claim that consciousness requires physicality"
    - "Find the logical flaw in: All humans are mortal, Socrates is mortal, therefore Socrates is human"
